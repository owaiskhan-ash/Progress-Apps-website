<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Project tracker</title><style>
:root{color-scheme:dark;--lime:#d9ff00;--muted:#858d7e;--panel:#151914}*{box-sizing:border-box}body{margin:0;background:#080a07;color:#f1f3e8;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}main{width:min(100%,480px);min-height:100dvh;margin:auto;padding:calc(32px + env(safe-area-inset-top,0px)) 26px 40px;position:relative}.nav{display:flex;align-items:center;justify-content:space-between;height:44px}.page-forward{animation:pageForward .2s cubic-bezier(.2,.7,.3,1)}@keyframes pageForward{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.milestone-fresh{animation:milestoneFresh .32s cubic-bezier(.2,.7,.3,1) both}@keyframes milestoneFresh{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media (prefers-reduced-motion:reduce){.page-forward,.milestone-fresh{animation:none}}.nav-title{font-size:14px;font-weight:600;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;text-align:center;flex:1}.back,.top-add{background:none;color:var(--lime);font-size:30px;line-height:1;width:44px;height:44px;padding:0}.back{text-align:left;font-size:38px}.top-add{text-align:right}.eyebrow{font-size:10px;letter-spacing:.17em;color:var(--muted);font-weight:700}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;pointer-events:none}.empty button{pointer-events:auto}.empty-plus{width:64px;height:64px;border-radius:50%;background:var(--panel);color:var(--lime);font-size:34px;font-weight:200}.empty-label{background:none;color:var(--lime);font-size:12px}.create h1,.list-title{font-size:28px;font-weight:400;margin:70px 0 9px;letter-spacing:-.03em}.sub{color:var(--muted);font-size:13px}.field{display:block;margin:32px 0 10px;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted)}input{width:100%;height:58px;border:1px solid transparent;border-radius:10px;background:var(--panel);padding:0 16px;color:#f1f3e8;outline:none}input:focus{border-color:var(--lime)}input::placeholder{color:#6f796b}.primary{height:54px;width:100%;border-radius:10px;background:var(--lime);color:#080a07;font-weight:700;margin-top:18px}.primary:active{transform:scale(.99)}.project-head{margin-top:54px;text-align:center}.ring-wrap{width:250px;height:250px;position:relative;margin:20px auto 0}.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}.track,.arc{fill:none;stroke-width:5}.track{stroke:#283023}.arc{stroke:var(--lime);stroke-linecap:round}.ring-dot{fill:var(--lime);stroke:#080a07;stroke-width:4}.percentage{position:absolute;inset:0;display:grid;place-items:center;font-size:48px;font-weight:300;letter-spacing:-.04em}.ring-add{position:absolute;right:38px;top:38px;height:30px;width:30px;border-radius:50%;background:var(--lime);color:#080a07;font-size:20px;font-weight:300;line-height:30px;padding:0}.hint{text-align:center;color:var(--muted);font-size:12px;margin:20px 0 50px}.milestone{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #252b21}.dot{color:var(--lime);font-size:10px}.milestone-note{flex:1}.amount{color:var(--lime);font-weight:600;font-size:13px}.list-title{margin:36px 0 8px}.project-item{display:flex;align-items:center;padding:20px 16px;background:var(--panel);border-radius:10px;margin-top:9px;cursor:pointer}.project-item span:first-child{flex:1;font-size:16px}.project-item span:last-child{color:var(--lime);font-weight:700}.modal-bg{position:fixed;inset:0;background:#0008;z-index:5;animation:fadeIn .2s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.modal{position:fixed;width:min(calc(100vw - 32px),320px);transform-origin:top right;background:#151914;padding:25px 22px 22px;border-radius:18px;animation:pop .42s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}.modal h2{font-size:21px;margin:0 0 7px}.modal .field{margin-top:23px}.modal input{background:#242a20}.error{color:#ff9a84;font-size:12px;margin-top:10px}.modal-actions{display:flex;gap:10px}.cancel{background:none;color:var(--muted);padding:0 15px;margin-top:18px}.preview-label{position:fixed;bottom:8px;right:10px;color:#535d4d;font-size:10px;pointer-events:none}@media(min-width:600px){main{border-left:1px solid #161c13;border-right:1px solid #161c13}}
body.light{background:#d9ff00;color:#080a07}body.light main{border-color:#bada00}body.light .eyebrow,body.light .top-add,body.light .back,body.light .empty-label{color:#080a07}body.light .empty-plus{background:#080a07;color:#d9ff00}body.light .sub{color:#434b19}body.light .field{color:#080a07}body.light input{background:#e8ff72;color:#080a07}body.light input::placeholder{color:#606d27}body.light input:focus{border-color:#080a07}body.light .primary{background:#080a07;color:#d9ff00}body.light .project-item{background:#080a07;color:#f1f3e8}body.light .preview-label{color:#607200}

.modal{width:min(calc(100vw - 32px),280px);background:#d9ff00;color:#080a07;border:2px solid #080a07;border-radius:14px;padding:18px;box-shadow:0 0 24px #d9ff00cc,0 12px 35px #0007}.modal h2{font-size:18px;margin-bottom:5px}.modal .sub{color:#434b19;font-size:12px}.modal .field{margin:16px 0 8px;color:#080a07}.modal input{height:46px;background:#e8ff72;color:#080a07;border-radius:8px}.modal input::placeholder{color:#606d27}.modal input:focus{border-color:#080a07}.modal-actions{justify-content:flex-end;align-items:center;margin-top:16px}.modal-actions .primary{width:86px;height:38px;margin:0;background:#080a07;color:#d9ff00;border-radius:8px;font-size:12px}.modal-actions .cancel{margin:0;padding:0 10px;height:38px;color:#434b19;font-size:12px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{appearance:textfield;-moz-appearance:textfield}
</style></head><body><main id="app"></main><div class="preview-label">BROWSER PREVIEW</div><script>
let projects=JSON.parse(localStorage.getItem('papertrailMinimal')||'[]');const app=document.querySelector('#app');function save(){localStorage.setItem('papertrailMinimal',JSON.stringify(projects))}function esc(s){const e=document.createElement('div');e.textContent=s||'';return e.innerHTML}function animatePage(){app.classList.remove('page-forward');void app.offsetWidth;app.classList.add('page-forward')}let freshMilestone=null;function home(){document.body.classList.add('light');app.innerHTML=`<div class="nav"><span class="eyebrow">PROJECTS</span><button class="top-add" aria-label="Add project" onclick="create()">+</button></div>${projects.length?`<h1 class="list-title">Your projects</h1><div class="sub">Select a project to see your progress.</div><div style="margin-top:25px">${projects.map((p,i)=>`<div class="project-item" onclick="project(${i})"><span>${esc(p.title)}</span><span>${p.progress}% &nbsp; ↗</span></div>`).join('')}</div>`:`<div class="empty"><button class="empty-plus" aria-label="Add project" onclick="create()">+</button><button class="empty-label" onclick="create()">Add project</button></div>`}`}
function create(){document.body.classList.add('light');animatePage();app.innerHTML=`<div class="nav"><button class="back" aria-label="Back" onclick="home()">‹</button></div><section class="create"><h1>Add project title</h1><div class="sub">Give your project a name.</div><label class="field" for="title">PROJECT TITLE</label><input id="title" placeholder="Project title" maxlength="100"><button class="primary" onclick="createProject()">Create project</button></section>`;document.querySelector('#title').addEventListener('keydown',e=>{if(e.key==='Enter')createProject()})}function createProject(){let input=document.querySelector('#title'),title=input.value.trim();if(!title){input.focus();return}projects.push({title,progress:0,entries:[]});save();project(projects.length-1)}function project(i){const samePage=!document.body.classList.contains('light')&&app.querySelector('.ring-wrap');if(!samePage)animatePage();document.body.classList.remove('light');let p=projects[i],r=102,c=2*Math.PI*r;app.innerHTML=`<div class="nav"><button class="back" aria-label="All projects" onclick="home()">‹</button><span class="nav-title">${esc(p.title)}</span><button class="top-add" aria-label="Add project" onclick="create()">+</button></div><div class="project-head eyebrow">PROJECT PROGRESS</div><div class="ring-wrap"><svg viewBox="0 0 250 250" aria-hidden="true"><circle class="track" cx="125" cy="125" r="${r}"/><circle class="arc" cx="125" cy="125" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p.progress/100)}"/>${p.entries.map(e=>{let a=e.at*2*Math.PI/100;return `<circle class="ring-dot" cx="${125+r*Math.cos(a)}" cy="${125+r*Math.sin(a)}" r="5"/>`}).join('')}</svg><div class="percentage">${p.progress}%</div><button class="ring-add" aria-label="Add milestone" onclick="modal(${i})">+</button></div><div class="hint">Add a milestone to update your progress</div>${p.entries.length?`<div class="eyebrow">MILESTONES</div>${[...p.entries].reverse().map((e,idx)=>`<div class="milestone${freshMilestone&&idx===0?' milestone-fresh':''}"><span class="dot">●</span><span class="milestone-note">${esc(e.note)}</span><span class="amount">+${e.amount}%</span></div>`).join('')}`:''}`}
function modal(i){const overlay=document.createElement('div');overlay.className='modal-bg';overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h2>Add milestone</h2><label class="field" for="amount">% TO ADD</label><input id="amount" type="number" min="1" max="100" step="1" placeholder="e.g. 10"><label class="field" for="note">MILESTONE NOTE</label><input id="note" placeholder="What did you accomplish?"><div id="error" class="error"></div><div class="modal-actions"><button class="cancel">Cancel</button><button class="primary" id="save">Save</button></div></div>`;document.body.append(overlay);const anchor=document.querySelector('.ring-add').getBoundingClientRect(),box=overlay.querySelector('.modal');const width=Math.min(280,window.innerWidth-32);box.style.left=Math.max(16,Math.min(window.innerWidth-width-16,anchor.right-width))+'px';box.style.top=Math.max(16,Math.min(anchor.bottom+8,window.innerHeight-box.offsetHeight-16))+'px';overlay.onclick=e=>{if(e.target===overlay||e.target.classList.contains('cancel'))overlay.remove()};overlay.querySelector('#save').onclick=()=>{let value=overlay.querySelector('#amount').value,amount=Number(value),note=overlay.querySelector('#note').value.trim(),p=projects[i],error=overlay.querySelector('#error');if(!Number.isInteger(amount)||amount<=0||amount>100-p.progress){error.textContent=p.progress===100?'Project is already complete.':`Enter a whole number from 1 to ${100-p.progress}.`;return}if(!note){error.textContent='Enter a milestone note.';return}p.progress+=amount;p.entries.push({amount,note,at:p.progress});save();overlay.remove();freshMilestone=true;project(i);freshMilestone=null};overlay.querySelector('#amount').focus()}home();</script></body></html>
